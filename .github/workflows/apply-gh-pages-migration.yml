name: Apply gh-pages coverage migration

on:
  push:
    branches:
      - feature/issue-54-code-coverage
    paths:
      - .github/workflows/apply-gh-pages-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: feature/issue-54-code-coverage
          fetch-depth: 0

      - name: Apply targeted migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacement_files = [
              Path('.github/workflows/pr-xunit-tests.yml'),
              Path('doc/design/detail/13-CodeCoverageVisualization.md'),
              Path('tests/SSC.Unit.Tests/Issue54CodeCoverageWorkflowContractUnitTests.cs'),
          ]
          for path in replacement_files:
              text = path.read_text(encoding='utf-8')
              updated = text.replace('coverage-pages', 'gh-pages')
              if updated == text:
                  raise SystemExit(f'Expected coverage-pages reference in {path}')
              path.write_text(updated, encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          old = '''PR用の `PR .NET Tests` workflowはUnit TestsとE2E TestsのCobertura coverageを収集し、GitHub Actions Summaryへline／branch coverageを表示します。詳細はworkflow artifactの `coverage/report/index.html` で確認できます。

通っていない関数を探す場合は、HTML reportでcoverageの低いclassを開き、method一覧を確認します。'''
          new = '''PR用の `PR .NET Tests` workflowはUnit TestsとE2E TestsのCobertura coverageを収集し、GitHub Actions Summaryへline／branch coverageを表示します。スマートフォン向けの単一HTMLはGitHub Pagesの[最新コードカバレッジ](https://ssaattww.github.io/SSC/)へ公開し、同じHTMLを専用 `gh-pages` branchの`index.html`へ保存します。PR branchは自動更新しません。

通っていない関数を探す場合は、GitHub PagesのHTML reportでcoverageの低いclassを開き、method一覧を確認します。より詳細なsource行表示が必要な場合はworkflow artifactの `coverage/report/index.html` も利用できます。'''
          if old not in readme_text:
              raise SystemExit('Expected README coverage block was not found')
          readme.write_text(readme_text.replace(old, new, 1), encoding='utf-8')

          report = Path('reports/task-t-097-issue-54-code-coverage-implementation-20260802.md')
          report_text = report.read_text(encoding='utf-8')
          heading = '## 11. スマートフォン公開方式の追加判断'
          if heading not in report_text:
              report_text += '''

## 11. スマートフォン公開方式の追加判断

### 11.1 PR branchへの自動コミットを採用しない理由

当初はActionsがPR branchの`reports/code-coverage.html`を更新する方式を試した。しかしbot commitでPR HEADが変化し、そのHEADのworkflowが`action_required`となった。PR current HEADとCI runのhead SHA一致を安定して検証できず、再実行条件を誤るとCI loopにつながるため、この方式は不採用とした。

### 11.2 `gh-pages` branchを採用した理由

生成済みHTMLの永続保存先には、GitHub Pagesで一般的に使われ、保守作業で削除対象と誤認されにくい`gh-pages` branchを採用した。branch直下には最新の成功coverageを示す`index.html`、`.nojekyll`、生成元HEADを示す`source-head.txt`、生成元PRを示す`source-pr.txt`だけを保存する。

PR番号をbranch名や公開URLへ含めず、`https://ssaattww.github.io/SSC/`を固定閲覧先とする。READMEにも同じURLを残す。

### 11.3 GitHub PagesとCI loopの防止

PR workflowのtriggerは`pull_request`と手動実行のみであり、`gh-pages`へのpushでは起動しない。公開jobはPR branchへpushせず、`gh-pages`だけを更新する。テストjobは`contents: read`、公開jobだけが`contents: write`、`pages: write`、`id-token: write`を持つ。

公開直前にremote PR HEADがrun開始時のHEADと一致することを確認し、古いrunからのreport公開を防止する。公開jobには固定concurrency groupを設定し、複数runが同時に`gh-pages`を更新しないようにする。
'''
              report.write_text(report_text, encoding='utf-8')

          migration = Path('.github/workflows/apply-gh-pages-migration.yml')
          migration.unlink()

          for path in replacement_files:
              if 'coverage-pages' in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'coverage-pages remains in {path}')
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use gh-pages for coverage publication"
          git push origin HEAD:feature/issue-54-code-coverage
