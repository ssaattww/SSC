name: PR .NET Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Discover test and generator projects
        id: discover
        shell: bash
        run: |
          mapfile -t test_projects < <(git ls-files '*.csproj' | grep -Ei '(test|tests)' || true)
          mapfile -t generator_projects < <(git ls-files '*.csproj' | grep -Ei '(generator|generators)' | grep -Evi '(test|tests)' || true)

          if [[ ${#test_projects[@]} -eq 0 ]]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_tests=true"
              echo "test_projects<<EOF"
              printf '%s\n' "${test_projects[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if [[ ${#generator_projects[@]} -eq 0 ]]; then
            echo "has_generators=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_generators=true"
              echo "generator_projects<<EOF"
              printf '%s\n' "${generator_projects[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare test diagnostic artifact
        if: ${{ steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true' }}
        shell: bash
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          rm -rf "$results_dir"
          mkdir -p "$results_dir/logs"

      - name: Restore and build source generators
        if: ${{ steps.discover.outputs.has_generators == 'true' }}
        shell: bash
        run: |
          logs_dir="$GITHUB_WORKSPACE/artifacts/test-results/logs"
          generator_status=0

          while IFS= read -r project; do
            [[ -z "$project" ]] && continue
            echo "Building generator: $project"

            result_name="$(printf '%s' "${project%.csproj}" | sed -E 's#[^A-Za-z0-9._-]+#_#g')"
            restore_stdout="$logs_dir/${result_name}-generator-restore.stdout.log"
            restore_stderr="$logs_dir/${result_name}-generator-restore.stderr.log"
            build_stdout="$logs_dir/${result_name}-generator-build.stdout.log"
            build_stderr="$logs_dir/${result_name}-generator-build.stderr.log"

            if ! dotnet restore "$project" \
              > >(tee "$restore_stdout") \
              2> >(tee "$restore_stderr" >&2); then
              generator_status=1
              continue
            fi

            if ! dotnet build "$project" \
              --configuration Release \
              --no-restore \
              --verbosity minimal \
              > >(tee "$build_stdout") \
              2> >(tee "$build_stderr" >&2); then
              generator_status=1
            fi
          done <<< "${{ steps.discover.outputs.generator_projects }}"

          exit "$generator_status"

      - name: Restore and run tests
        if: ${{ steps.discover.outputs.has_tests == 'true' }}
        shell: bash
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          logs_dir="$results_dir/logs"
          mkdir -p "$logs_dir"
          test_status=0

          while IFS= read -r project; do
            [[ -z "$project" ]] && continue
            echo "Testing: $project"

            result_name="$(printf '%s' "${project%.csproj}" | sed -E 's#[^A-Za-z0-9._-]+#_#g')"
            restore_stdout="$logs_dir/${result_name}-restore.stdout.log"
            restore_stderr="$logs_dir/${result_name}-restore.stderr.log"
            test_stdout="$logs_dir/${result_name}-test.stdout.log"
            test_stderr="$logs_dir/${result_name}-test.stderr.log"

            if ! dotnet restore "$project" \
              > >(tee "$restore_stdout") \
              2> >(tee "$restore_stderr" >&2); then
              test_status=1
              continue
            fi

            if ! dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --verbosity minimal \
              --logger "trx;LogFileName=${result_name}.trx" \
              --results-directory "$results_dir" \
              > >(tee "$test_stdout") \
              2> >(tee "$test_stderr" >&2); then
              test_status=1
            fi
          done <<< "${{ steps.discover.outputs.test_projects }}"

          exit "$test_status"

      - name: Collect .NET diagnostic context
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        shell: bash
        env:
          TEST_PROJECTS: ${{ steps.discover.outputs.test_projects }}
          GENERATOR_PROJECTS: ${{ steps.discover.outputs.generator_projects }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          diagnostics_dir="$GITHUB_WORKSPACE/artifacts/test-results/diagnostics"
          mkdir -p "$diagnostics_dir"

          dotnet --info \
            > "$diagnostics_dir/dotnet-info.stdout.log" \
            2> "$diagnostics_dir/dotnet-info.stderr.log" || true

          git status --short --branch \
            > "$diagnostics_dir/git-status.stdout.log" \
            2> "$diagnostics_dir/git-status.stderr.log" || true

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow commit: $GITHUB_SHA"
            if [[ -n "${PR_HEAD_SHA:-}" ]]; then
              echo "Pull request head: $PR_HEAD_SHA"
            fi
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $RUNNER_ARCH"
          } > "$diagnostics_dir/runner-context.stdout.log" \
            2> "$diagnostics_dir/runner-context.stderr.log"

          {
            echo "# Test projects"
            printf '%s\n' "$TEST_PROJECTS"
            echo
            echo "# Generator projects"
            printf '%s\n' "$GENERATOR_PROJECTS"
          } > "$diagnostics_dir/project-list.stdout.log" \
            2> "$diagnostics_dir/project-list.stderr.log"

      - name: Create test result manifest
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_PROJECTS: ${{ steps.discover.outputs.test_projects }}
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          mkdir -p "$results_dir"

          {
            echo "# SSC .NET test results"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Workflow commit: \`$GITHUB_SHA\`"
            if [[ -n "${PR_HEAD_SHA:-}" ]]; then
              echo "- Pull request head: \`$PR_HEAD_SHA\`"
            fi
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
            if [[ -n "${PR_NUMBER:-}" ]]; then
              echo "- Pull request: \`#$PR_NUMBER\`"
            fi
            echo "- Authorization: The repository owner explicitly approved retaining these test results as a GitHub Actions artifact for ChatGPT-assisted review when this workflow behavior was added in PR #47."
            echo
            echo "## Test projects"
            while IFS= read -r project; do
              [[ -z "$project" ]] && continue
              echo "- \`$project\`"
            done <<< "$TEST_PROJECTS"
            echo
            echo "## Artifact files"

            mapfile -t artifact_files < <(
              find "$results_dir" -type f ! -name manifest.md -printf '%P\n' | sort
            )
            if [[ ${#artifact_files[@]} -eq 0 ]]; then
              echo "- No test result or diagnostic files were produced."
            else
              for artifact_file in "${artifact_files[@]}"; do
                echo "- \`$artifact_file\`"
              done
            fi
          } > "$results_dir/manifest.md"

          cat "$results_dir/manifest.md" >> "$GITHUB_STEP_SUMMARY"

      # The repository owner explicitly approved retaining this artifact so
      # ChatGPT-assisted review can inspect the same test evidence as maintainers.
      - name: Upload .NET test results for ChatGPT review
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: ssc-pr-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 7

      - name: No test projects found
        if: ${{ steps.discover.outputs.has_tests != 'true' }}
        run: echo "::notice::No .NET test projects were found. Skipping tests."
