name: PR .NET Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Discover test and generator projects
        id: discover
        shell: bash
        run: |
          mapfile -t test_projects < <(git ls-files '*.csproj' | grep -Ei '(test|tests)' || true)
          mapfile -t generator_projects < <(git ls-files '*.csproj' | grep -Ei '(generator|generators)' | grep -Evi '(test|tests)' || true)

          if [[ ${#test_projects[@]} -eq 0 ]]; then
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_tests=true"
              echo "test_projects<<EOF"
              printf '%s\n' "${test_projects[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if [[ ${#generator_projects[@]} -eq 0 ]]; then
            echo "has_generators=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "has_generators=true"
              echo "generator_projects<<EOF"
              printf '%s\n' "${generator_projects[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare test diagnostic artifact
        if: ${{ steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true' }}
        shell: bash
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          rm -rf "$results_dir"
          mkdir -p "$results_dir/logs"
          mkdir -p \
            "$results_dir/test-runs" \
            "$results_dir/coverage/raw" \
            "$results_dir/coverage/report" \
            "$results_dir/coverage/mobile" \
            "$results_dir/coverage/logs"

      - name: Restore and build source generators
        if: ${{ steps.discover.outputs.has_generators == 'true' }}
        shell: bash
        run: |
          logs_dir="$GITHUB_WORKSPACE/artifacts/test-results/logs"
          generator_status=0

          while IFS= read -r project; do
            [[ -z "$project" ]] && continue
            echo "Building generator: $project"

            result_name="$(printf '%s' "${project%.csproj}" | sed -E 's#[^A-Za-z0-9._-]+#_#g')"
            restore_stdout="$logs_dir/${result_name}-generator-restore.stdout.log"
            restore_stderr="$logs_dir/${result_name}-generator-restore.stderr.log"
            build_stdout="$logs_dir/${result_name}-generator-build.stdout.log"
            build_stderr="$logs_dir/${result_name}-generator-build.stderr.log"

            if ! dotnet restore "$project" \
              > >(tee "$restore_stdout") \
              2> >(tee "$restore_stderr" >&2); then
              generator_status=1
              continue
            fi

            if ! dotnet build "$project" \
              --configuration Release \
              --no-restore \
              --verbosity minimal \
              > >(tee "$build_stdout") \
              2> >(tee "$build_stderr" >&2); then
              generator_status=1
            fi
          done <<< "${{ steps.discover.outputs.generator_projects }}"

          exit "$generator_status"

      - name: Restore and run tests with code coverage
        id: tests
        if: ${{ steps.discover.outputs.has_tests == 'true' }}
        shell: bash
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          logs_dir="$results_dir/logs"
          coverage_raw_dir="$results_dir/coverage/raw"
          mkdir -p "$logs_dir" "$coverage_raw_dir"
          test_status=0

          while IFS= read -r project; do
            [[ -z "$project" ]] && continue
            echo "Testing with coverage: $project"

            result_name="$(printf '%s' "${project%.csproj}" | sed -E 's#[^A-Za-z0-9._-]+#_#g')"
            project_results_dir="$results_dir/test-runs/$result_name"
            restore_stdout="$logs_dir/${result_name}-restore.stdout.log"
            restore_stderr="$logs_dir/${result_name}-restore.stderr.log"
            test_stdout="$logs_dir/${result_name}-test.stdout.log"
            test_stderr="$logs_dir/${result_name}-test.stderr.log"
            mkdir -p "$project_results_dir"

            if ! dotnet restore "$project" \
              > >(tee "$restore_stdout") \
              2> >(tee "$restore_stderr" >&2); then
              test_status=1
              continue
            fi

            project_test_status=0
            if ! dotnet test "$project" \
              --configuration Release \
              --no-restore \
              --verbosity minimal \
              --logger "trx;LogFileName=${result_name}.trx" \
              --results-directory "$project_results_dir" \
              --collect:"XPlat Code Coverage" \
              > >(tee "$test_stdout") \
              2> >(tee "$test_stderr" >&2); then
              project_test_status=1
              test_status=1
            fi

            mapfile -t project_coverage_files < <(
              find "$project_results_dir" -type f -name 'coverage.cobertura.xml' | sort
            )

            if [[ ${#project_coverage_files[@]} -eq 0 ]]; then
              echo "No Cobertura coverage file was produced for $project." >&2
              if [[ $project_test_status -eq 0 ]]; then
                test_status=1
              fi
              continue
            fi

            coverage_index=0
            declare -A copied_coverage_hashes=()
            for coverage_file in "${project_coverage_files[@]}"; do
              coverage_hash="$(sha256sum "$coverage_file" | awk '{print $1}')"
              if [[ -n "${copied_coverage_hashes[$coverage_hash]:-}" ]]; then
                continue
              fi

              copied_coverage_hashes[$coverage_hash]=1
              coverage_index=$((coverage_index + 1))
              cp "$coverage_file" \
                "$coverage_raw_dir/${result_name}-${coverage_index}.cobertura.xml"
            done
          done <<< "${{ steps.discover.outputs.test_projects }}"

          exit "$test_status"

      - name: Generate merged code coverage report
        id: coverage
        if: ${{ always() && steps.discover.outputs.has_tests == 'true' }}
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_STEP_OUTCOME: ${{ steps.tests.outcome }}
          REPORTGENERATOR_VERSION: "5.5.10"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          coverage_dir="$results_dir/coverage"
          coverage_raw_dir="$coverage_dir/raw"
          coverage_report_dir="$coverage_dir/report"
          coverage_mobile_dir="$coverage_dir/mobile"
          coverage_logs_dir="$coverage_dir/logs"
          reportgenerator_dir="$RUNNER_TEMP/reportgenerator"
          inputs_file="$coverage_dir/coverage-inputs.txt"
          install_stdout="$coverage_logs_dir/reportgenerator-install.stdout.log"
          install_stderr="$coverage_logs_dir/reportgenerator-install.stderr.log"
          generate_stdout="$coverage_logs_dir/reportgenerator.stdout.log"
          generate_stderr="$coverage_logs_dir/reportgenerator.stderr.log"

          mkdir -p \
            "$coverage_raw_dir" \
            "$coverage_report_dir" \
            "$coverage_mobile_dir" \
            "$coverage_logs_dir" \
            "$reportgenerator_dir"

          mapfile -t coverage_files < <(
            find "$coverage_raw_dir" -type f -name '*.cobertura.xml' | sort
          )
          printf '%s\n' "${coverage_files[@]}" > "$inputs_file"

          if [[ ${#coverage_files[@]} -eq 0 ]]; then
            echo "No raw Cobertura coverage files were available." >&2
            if [[ "$TEST_STEP_OUTCOME" == "success" ]]; then
              exit 1
            fi

            echo "Tests did not succeed, so the missing coverage report is retained as diagnostic evidence."
            exit 0
          fi

          if ! dotnet tool install dotnet-reportgenerator-globaltool \
            --tool-path "$reportgenerator_dir" \
            --version "$REPORTGENERATOR_VERSION" \
            > >(tee "$install_stdout") \
            2> >(tee "$install_stderr" >&2); then
            exit 1
          fi

          reports_argument="$(IFS=';'; echo "${coverage_files[*]}")"
          report_tag="${PR_HEAD_SHA:-$GITHUB_SHA}"

          if ! "$reportgenerator_dir/reportgenerator" \
            "-reports:$reports_argument" \
            "-targetdir:$coverage_report_dir" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub;TextSummary" \
            "-assemblyfilters:+SSC;+SSC.Generators" \
            "-sourcedirs:$GITHUB_WORKSPACE" \
            "-title:SSC code coverage" \
            "-tag:$report_tag" \
            "-verbosity:Info" \
            > >(tee "$generate_stdout") \
            2> >(tee "$generate_stderr" >&2); then
            exit 1
          fi

          html_entry="$coverage_report_dir/index.html"
          merged_cobertura="$coverage_report_dir/Cobertura.xml"
          summary_markdown="$(find "$coverage_report_dir" -maxdepth 1 -type f -iname '*github*.md' | head -n 1)"
          text_summary="$(find "$coverage_report_dir" -maxdepth 1 -type f -iname '*summary*.txt' | head -n 1)"

          if [[ ! -f "$html_entry" || ! -f "$merged_cobertura" || -z "$summary_markdown" || -z "$text_summary" ]]; then
            echo "ReportGenerator did not produce all required coverage outputs." >&2
            find "$coverage_report_dir" -maxdepth 2 -type f -printf '%P\n' | sort >&2
            exit 1
          fi

          mobile_report="$coverage_mobile_dir/code-coverage.html"
          python3 scripts/generate-mobile-coverage-report.py \
            --input "$merged_cobertura" \
            --output "$mobile_report" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$report_tag" \
            --title "SSC code coverage"

          if [[ ! -s "$mobile_report" ]]; then
            echo "Mobile coverage report was not generated." >&2
            exit 1
          fi

          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

          {
            echo "## SSC code coverage"
            echo
            echo "- Pull request head: \`${PR_HEAD_SHA:-not-a-pull-request}\`"
            echo "- Workflow commit: \`$GITHUB_SHA\`"
            echo "- Mobile report after publication: [$pages_url]($pages_url)"
            echo "- Detailed line coverage: artifact \`ssc-pr-test-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\`, file \`coverage/report/index.html\`"
            echo
            cat "$summary_markdown"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare GitHub Pages artifact
        if: ${{ steps.coverage.outcome == 'success' }}
        shell: bash
        run: |
          pages_dir="$GITHUB_WORKSPACE/artifacts/pages"
          rm -rf "$pages_dir"
          mkdir -p "$pages_dir"
          cp "$GITHUB_WORKSPACE/artifacts/test-results/coverage/mobile/code-coverage.html" \
            "$pages_dir/index.html"
          touch "$pages_dir/.nojekyll"

      - name: Upload GitHub Pages artifact
        if: ${{ steps.coverage.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
          include-hidden-files: true

      - name: Collect .NET diagnostic context
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        shell: bash
        env:
          TEST_PROJECTS: ${{ steps.discover.outputs.test_projects }}
          GENERATOR_PROJECTS: ${{ steps.discover.outputs.generator_projects }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          diagnostics_dir="$GITHUB_WORKSPACE/artifacts/test-results/diagnostics"
          mkdir -p "$diagnostics_dir"

          dotnet --info \
            > "$diagnostics_dir/dotnet-info.stdout.log" \
            2> "$diagnostics_dir/dotnet-info.stderr.log" || true

          git status --short --branch \
            > "$diagnostics_dir/git-status.stdout.log" \
            2> "$diagnostics_dir/git-status.stderr.log" || true

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow commit: $GITHUB_SHA"
            if [[ -n "${PR_HEAD_SHA:-}" ]]; then
              echo "Pull request head: $PR_HEAD_SHA"
            fi
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $RUNNER_ARCH"
          } > "$diagnostics_dir/runner-context.stdout.log" \
            2> "$diagnostics_dir/runner-context.stderr.log"

          {
            echo "# Test projects"
            printf '%s\n' "$TEST_PROJECTS"
            echo
            echo "# Generator projects"
            printf '%s\n' "$GENERATOR_PROJECTS"
          } > "$diagnostics_dir/project-list.stdout.log" \
            2> "$diagnostics_dir/project-list.stderr.log"

      - name: Preserve checked-out source
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        shell: bash
        run: |
          source_dir="$GITHUB_WORKSPACE/artifacts/test-results/source"
          source_archive="$source_dir/checked-out-source.tar"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          git archive --format=tar HEAD > "$source_archive"
          git rev-parse HEAD > "$source_dir/checked-out-head.txt"
          git status --short --untracked-files=no > "$source_dir/git-status.txt"

      - name: Create test result manifest
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_PROJECTS: ${{ steps.discover.outputs.test_projects }}
        run: |
          results_dir="$GITHUB_WORKSPACE/artifacts/test-results"
          mkdir -p "$results_dir"

          {
            echo "# SSC .NET test results"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Workflow commit: \`$GITHUB_SHA\`"
            if [[ -n "${PR_HEAD_SHA:-}" ]]; then
              echo "- Pull request head: \`$PR_HEAD_SHA\`"
            fi
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Run attempt: \`$GITHUB_RUN_ATTEMPT\`"
            if [[ -n "${PR_NUMBER:-}" ]]; then
              echo "- Pull request: \`#$PR_NUMBER\`"
            fi
            echo "- Authorization: The repository owner explicitly approved retaining these test results as a GitHub Actions artifact for ChatGPT-assisted review when this workflow behavior was added in PR #47."
            echo
            echo "## Test projects"
            while IFS= read -r project; do
              [[ -z "$project" ]] && continue
              echo "- \`$project\`"
            done <<< "$TEST_PROJECTS"
            echo
            echo "## Coverage"
            echo "- Summary is written to the GitHub Actions job summary."
            echo "- Mobile single-file report: \`coverage/mobile/code-coverage.html\`"
            echo "- Detailed HTML report: \`coverage/report/index.html\`"
            echo "- Merged Cobertura: \`coverage/report/Cobertura.xml\`"
            echo "- Raw project reports: \`coverage/raw/*.cobertura.xml\`"
            echo
            echo "## Artifact files"

            mapfile -t artifact_files < <(
              find "$results_dir" -type f ! -name manifest.md -printf '%P\n' | sort
            )
            if [[ ${#artifact_files[@]} -eq 0 ]]; then
              echo "- No test result or diagnostic files were produced."
            else
              for artifact_file in "${artifact_files[@]}"; do
                echo "- \`$artifact_file\`"
              done
            fi
          } > "$results_dir/manifest.md"

          cat "$results_dir/manifest.md" >> "$GITHUB_STEP_SUMMARY"

      # The repository owner explicitly approved retaining this artifact so
      # ChatGPT-assisted review can inspect the same test evidence as maintainers.
      - name: Upload .NET test results for ChatGPT review
        if: ${{ always() && (steps.discover.outputs.has_tests == 'true' || steps.discover.outputs.has_generators == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: ssc-pr-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 7

      - name: No test projects found
        if: ${{ steps.discover.outputs.has_tests != 'true' }}
        run: echo "::notice::No .NET test projects were found. Skipping tests."

  publish-coverage-report:
    name: Publish mobile coverage report
    needs: dotnet-tests
    if: ${{ always() && needs.dotnet-tests.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-pages
      cancel-in-progress: true
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ssc-pr-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-artifact

      - name: Publish report branch
        id: publish
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_BRANCH: coverage-pages
        run: |
          source_report="$RUNNER_TEMP/coverage-artifact/coverage/mobile/code-coverage.html"
          target_report="index.html"

          if [[ ! -s "$source_report" ]]; then
            echo "Downloaded artifact does not contain the mobile coverage report." >&2
            exit 1
          fi

          remote_pr_head="$(git ls-remote origin "refs/heads/$PR_HEAD_REF" | awk '{print $1}')"
          if [[ "$remote_pr_head" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "PR HEAD moved from $EXPECTED_HEAD_SHA to $remote_pr_head; stale report will not be published."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code origin "refs/heads/$REPORT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$REPORT_BRANCH"
            git switch --force-create "$REPORT_BRANCH" "origin/$REPORT_BRANCH"
          else
            git switch --orphan "$REPORT_BRANCH"
            git rm -rf --ignore-unmatch .
            git clean -fdx
          fi

          cp "$source_report" "$target_report"
          touch .nojekyll
          printf '%s\n' "$EXPECTED_HEAD_SHA" > source-head.txt
          printf '%s\n' "PR #$PR_NUMBER" > source-pr.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Published mobile coverage report is unchanged."
          else
            git commit -m "chore: publish code coverage report"
            git push origin "HEAD:$REPORT_BRANCH"
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: ${{ steps.publish.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5

      - name: Deploy coverage report to GitHub Pages
        id: deployment
        if: ${{ steps.publish.outputs.should_deploy == 'true' }}
        uses: actions/deploy-pages@v4
